name: bcreations
description: Bcreations — orders, stock, production and money tracking for a handmade craft business.
publish_to: 'none' # Prevents accidental publishing to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Database (Drift / SQLite)
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0

  # Utilities
  intl: any # version is pinned by flutter_localizations
  path: ^1.9.1
  path_provider: ^2.1.2 # app folder for photos
  share_plus: ^12.0.2
  url_launcher: ^6.3.2 # call / WhatsApp
  image_picker: ^1.2.2 # reference and product photos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation (Drift)
  build_runner: ^2.4.9
  drift_dev: ^2.35.3

  # Branding
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true # Hindi / English strings from lib/l10n/*.arb
  assets:
    - assets/branding/icon_foreground.png

# App icon — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21

# Splash screen — regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/branding/icon_foreground.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/branding/icon_foreground.png"
  ios: false
  web: false
