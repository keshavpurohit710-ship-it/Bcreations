name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Infos (mostly deprecation notices in the old UI) don't fail the build yet;
      # warnings and errors do. Tighten to --fatal-infos once Phase 1-5 replace the old code.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Debug-signed until the release keystore is added as a CI secret (docs/RELEASE.md).
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bcreations-apk
          path: build/app/outputs/flutter-apk/app-release.apk
